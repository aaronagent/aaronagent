<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aaron Lab has moved from aaronagent to aaronlab. The current featured AI open-source project is BrowserTrace.">
  <meta http-equiv="refresh" content="8; url=https://github.com/aaronlab/browsertrace">
  <meta property="og:title" content="Aaron Lab">
  <meta property="og:description" content="Current featured project: BrowserTrace, a local flight recorder for AI browser agents.">
  <meta property="og:image" content="https://raw.githubusercontent.com/aaronlab/browsertrace/main/docs/social-preview.png">
  <meta property="og:url" content="https://aaronlab.github.io/aaronagent/">
  <meta name="twitter:card" content="summary_large_image">
  <title>Aaron Lab -> BrowserTrace</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fb;
      --panel: #ffffff;
      --text: #16202a;
      --muted: #5e6a77;
      --line: #d8dee8;
      --accent: #0f766e;
      --accent-strong: #115e59;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101418;
        --panel: #171d22;
        --text: #edf2f7;
        --muted: #a9b4c0;
        --line: #2d3742;
        --accent: #5eead4;
        --accent-strong: #99f6e4;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    main {
      width: min(1120px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 520px);
      gap: 48px;
      align-items: center;
      padding: 56px 0;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 720px;
      font-size: clamp(42px, 7vw, 78px);
      line-height: 1.02;
      letter-spacing: 0;
    }

    .lead {
      max-width: 660px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: 20px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
    }

    a.button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--panel);
    }

    a.button:hover {
      border-color: var(--accent-strong);
      color: var(--accent-strong);
    }

    a.button.primary:hover {
      background: var(--accent-strong);
      color: var(--panel);
    }

    .note {
      margin-top: 22px;
      color: var(--muted);
      font-size: 14px;
    }

    .preview {
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .preview img {
      display: block;
      width: 100%;
      aspect-ratio: 1200 / 630;
      object-fit: cover;
    }

    .preview figcaption {
      padding: 14px 16px;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
        gap: 32px;
        align-content: center;
      }

      .lead {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section>
      <p class="eyebrow">Account renamed</p>
      <h1>Aaron Lab now builds from aaronlab.</h1>
      <p class="lead">
        This old aaronagent page now points to BrowserTrace, the current
        local-first AI browser-agent debugging project.
      </p>
      <div class="actions">
        <a class="button primary" href="https://github.com/aaronlab/browsertrace">Open BrowserTrace</a>
        <a class="button" href="https://aaronlab.github.io/browsertrace/">View live demo</a>
        <a class="button" href="https://github.com/aaronlab">GitHub profile</a>
      </div>
      <p class="note">
        You will be redirected to the BrowserTrace repository in a few seconds.
      </p>
    </section>

    <figure class="preview">
      <img src="https://raw.githubusercontent.com/aaronlab/browsertrace/main/docs/social-preview.png" alt="BrowserTrace social preview">
      <figcaption>
        BrowserTrace records local timelines for failed AI browser-agent runs,
        with public-safe HTML exports for sharing.
      </figcaption>
    </figure>
  </main>
</body>
</html>
